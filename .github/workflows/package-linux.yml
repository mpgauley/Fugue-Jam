name: Package Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Linux packages (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config ruby-full rpm zstd
          sudo gem install --no-document fpm
          cargo install cargo-deb --locked

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build distribution packages
        run: bash packaging/build-linux-packages.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fugue-jam-linux-x86_64
          path: target/packages/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/packages/*
