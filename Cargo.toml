[package]
name = "fugue-jam"
version = "14.0.0"
edition = "2024"
description = "A local-first Linux music player"
license = "Apache-2.0"

[package.metadata.deb]
maintainer = "Matt Gauley <mpgauley@gmail.com>"
extended-description = "A local-first Linux music player with a persistent library, playlists, queue, and equalizer."
depends = "$auto"
recommends = ["fonts-noto-cjk"]
section = "sound"
priority = "optional"
assets = [
    ["target/release/fugue-jam", "usr/bin/", "755"],
    ["packaging/fugue-jam.desktop", "usr/share/applications/fugue-jam.desktop", "644"],
    ["README.md", "usr/share/doc/fugue-jam/README.md", "644"],
    ["LICENSE", "usr/share/doc/fugue-jam/LICENSE", "644"],
]

[dependencies]
cpal = "0.15"
directories = "6"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lofty = "0.22"
rand = "0.9"
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-all", "symphonia-aiff", "symphonia-alac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
